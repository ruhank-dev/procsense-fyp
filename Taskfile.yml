version: "3"

# Run `task --list` to see everything. Install Task: winget install Task.Task

tasks:
  blender-doctor:
    desc: Check the exact Blender pilot pipeline version
    cmds:
      - uv run --project tools tools/blender/run.py doctor

  blender-build:
    desc: Build procedural equipment (pass -- asset_id or all)
    cmds:
      - uv run --project tools tools/blender/run.py build {{.CLI_ARGS}}

  blender-validate:
    desc: Validate saved equipment geometry and interaction anchors
    cmds:
      - uv run --project tools tools/blender/run.py validate {{.CLI_ARGS}}

  blender-preview:
    desc: Render the four equipment review views
    cmds:
      - uv run --project tools tools/blender/run.py preview {{.CLI_ARGS}}

  blender-build-all:
    desc: Build, validate, export and render all pilot equipment
    cmds:
      - uv run --project tools tools/blender/run.py all

  blender-selftest:
    desc: Exercise pipeline positive and deliberately invalid geometry
    cmds:
      - uv run --project tools tools/blender/run.py selftest

  build:
    desc: Build the whole .NET solution (Core, CLI, tests)
    cmds:
      - dotnet build ProcSense.sln

  test:
    desc: Run all Core tests
    cmds:
      - dotnet test ProcSense.sln

  sim:
    desc: Run the headless simulator, e.g. task sim -- run --case VAR-S1-A --seed 42 --actions tests/samples/smoke.actions.json --out result.json
    cmds:
      - dotnet run --project src/ProcSense.Cli -- {{.CLI_ARGS}}

  golden:
    desc: Run every golden run in tests/golden through the CLI and compare with its expected file (add -- --update to rewrite them deliberately)
    cmds:
      - dotnet run --project src/ProcSense.Cli -- golden {{.CLI_ARGS}}

  setup:
    desc: One-time setup after cloning - installs the pre-push hook (runs task ci before main is updated) and checks your tools
    cmds:
      - git config core.hooksPath .githooks
      - cmd: chmod +x .githooks/pre-push .githooks/commit-msg
        ignore_error: true
      - uv run --project tools tools/ci/setup_check.py

  voice-catalogue:
    desc: Build content/voice/catalogue.json (every spoken line of the P0 cases with its speaker, event and source) and list the events without a line and the drafts awaiting review
    cmds:
      - uv run --project tools tools/voice/catalogue.py

  report-ai:
    desc: Regenerate docs/report/ai-eval.md from the result files in reports/ai (no hand-typed numbers)
    cmds:
      - uv run --project tools tools/eval/collect_ai.py

  check-hosts:
    desc: Check this machine as a model host (Ollama, the wanted models and their digests, faster-whisper, Piper, ffmpeg, GPU); add --ask to send a schema-constrained prompt
    cmds:
      - uv run --project tools tools/ai/check_hosts.py {{.CLI_ARGS}}

  compose:
    desc: Compose practice cases from approved spines and blocks, e.g. task compose -- compose --scenario S1 --difficulty 2 --n 20 --seed 7 (each card goes through Stage B before it is written to build/composed)
    cmds:
      - uv run --project tools tools/composer/cli.py {{.CLI_ARGS}}

  compose-multiproblem:
    desc: Compose new multi-problem case structures by the walkthrough 14B.5 recipe from approved problems (tests/composition/compositions.json; synthetic DRAFT fixtures, not clinically validated)
    cmds:
      - uv run --project tools tools/composer/multiproblem.py {{.CLI_ARGS}}

  classifier-safety-page:
    desc: Regenerate docs/research/classifier_benchmark/safety_gate.md from the result files
    cmds:
      - uv run --project tools tools/bench/safety_report.py

  model-compare:
    desc: Regenerate the historical Qwen 3.5 4B against 9B page (docs/research/model_4b_vs_9b.md) from the committed result files
    cmds:
      - uv run --project tools tools/ai/model_compare.py

  external-testing:
    desc: Regenerate the single external-testing handoff (docs/testing/SANNAN_EXTERNAL_TESTING.md) and link it from the step files
    cmds:
      - uv run --project tools tools/plans/external_testing.py --link-steps

  feature-matrix:
    desc: Regenerate the feature implementation matrix of the 68 plans and sync the pipeline JSON statuses, then the generated plans
    cmds:
      - uv run --project tools tools/plans/feature_matrix.py --sync-json
      - uv run --project tools tools/plans/pipeline_docs.py

  blocks:
    desc: Rebuild the composer's block library, tag vocabulary and templates from the case files (content/blocks, content/templates)
    cmds:
      - uv run --project tools tools/composer/blocks.py

  voice-render:
    desc: Render the voice-line catalogue to audio (build/voice, git-ignored) with the offline voice; only new or changed lines are rendered. Needs Piper, the voice model and ffmpeg (see tools/voice/README.md)
    cmds:
      - uv run --project tools tools/voice/render.py {{.CLI_ARGS}}

  voice-check:
    desc: Check every plain line of the catalogue has a rendered file of sane length at the target loudness (-16 LUFS)
    cmds:
      - uv run --project tools tools/voice/render.py --check

  report-experiments:
    desc: Regenerate the experiments chapter of the report (docs/report/experiments.md) from the phase READMEs
    cmds:
      - uv run --project tools tools/eval/collect_experiments.py

  attributions:
    desc: Regenerate docs/ATTRIBUTIONS.md and the in-app credits (content/attributions/attributions.json) from the registers
    cmds:
      - uv run --project tools tools/eval/attributions.py

  doctor:
    desc: List every tool the project uses with the version it wants and the version installed; exit code 1 if a required tool is missing
    cmds:
      - uv run --no-project tools/doctor.py

  repo-backup:
    desc: Write a verified git bundle of every branch and tag to a folder outside the repo (default Desktop/ProcSense_branch_backup), e.g. task repo-backup -- --out D:/backups --keep 10
    cmds:
      - uv run --no-project tools/repo_backup.py {{.CLI_ARGS}}

  protect-main:
    desc: DO NOT RUN on the free private plan (GitHub refuses it). Applies .github/branch-protection.json if the plan ever allows server-side protection (DT-042)
    cmds:
      - gh api -X PUT repos/ruhank-dev/procsense-fyp/branches/main/protection --input .github/branch-protection.json

  check:
    desc: Project-rule checks no compiler covers (determinism rules in Core, repo hygiene, doc links, registers, prompt history)
    cmds:
      - uv run --project tools tools/ci/repo_checks.py

  plans-check:
    desc: Fail if docs/plans/milestones.md is out of date (what CI runs)
    cmds:
      - uv run --project tools tools/plans/milestones.py --check
      - uv run --project tools tools/plans/validate_pipeline.py --quiet
      - uv run --project tools tools/plans/test_validate_pipeline.py
      - uv run --project tools tools/plans/pipeline_docs.py --check
      - uv run --project tools tools/plans/check_planning_sync.py

  format:
    desc: Verify code format (CI is the authority; Windows checkouts report line-ending errors)
    cmds:
      - dotnet format ProcSense.sln --verify-no-changes

  unity-test:
    desc: Run the Unity EditMode and PlayMode tests in batch mode (needs Unity 6000.5.10f1; set UNITY_EXE if it is not in the default Hub folder)
    cmds:
      - uv run --project tools tools/unity/run_unity.py test

  unity-build:
    desc: Build the Quest APK into artifacts/unity/ProcSense.apk (needs Unity with Android support)
    cmds:
      - uv run --project tools tools/unity/run_unity.py build

  ci:
    desc: Run every check CI runs, locally (add -- --quick to skip build and tests)
    cmds:
      - uv run --project tools tools/ci/run_all.py {{.CLI_ARGS}}

  ci-status:
    desc: Last local CI result next to GitHub's recent runs (a run that never started is shown as never_started, not as a pass)
    cmds:
      - uv run --project tools tools/ci/remote_status.py

  pulse-check:
    desc: Validate the Pulse mapping and recorded traces and rebuild the parity page from them (no Pulse needed)
    cmds:
      - uv run --project tools tools/ci/test_pulse.py

  content-validate:
    desc: Check every content file against its schema and the source register (proof of truth)
    cmds:
      - uv run --project tools tools/content/validate.py

  content-package:
    desc: Package content for one mode (dev, practice or assessment) with a manifest that proves it, e.g. task content-package -- --mode practice --out build/content-practice
    cmds:
      - uv run --project tools tools/content/package.py {{.CLI_ARGS}}

  server-dev:
    desc: Run the backend on this computer (needs server/.env, copied from server/.env.example)
    cmds:
      - uv run --project server uvicorn server.main:app --reload --port 8000

  server-test:
    desc: Run the backend tests against a real PostgreSQL (TEST_DATABASE_URL, or a throwaway one in Docker)
    cmds:
      - uv run --project tools tools/ci/server_tests.py

  server-migrate:
    desc: Apply the database migrations to the database in MIGRATION_DATABASE_URL (the session pooler, port 5432)
    cmds:
      - uv run --project server alembic -c server/alembic.ini upgrade head

  server-engine-prepare:
    desc: Build what the service needs to verify sessions into server/engine (the engine for Linux and the content of each version); the image build copies it
    cmds:
      - dotnet publish src/ProcSense.Cli -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o server/engine/bin
      - uv run --project tools tools/content/package_versions.py --out server/engine/content

  demo-session:
    desc: Write a session file with the real engine and the header the hosted service verifies (task demo-session -- --out demo_session.jsonl)
    cmds:
      - uv run --project tools tools/demo/make_demo_session.py {{.CLI_ARGS}}

  headset-sim:
    desc: Stand in for the headset - sign in with a code, upload a session file, wait for the verdict, fetch progress (task headset-sim -- --url https://... --file demo_session.jsonl)
    cmds:
      - uv run --project server python -m server.scripts.headset_sim {{.CLI_ARGS}}

  server-admin:
    desc: Platform administration by the team, e.g. task server-admin -- create-organisation --name "Alpha" --slug alpha --admin-email a@b.com (see server/RUNBOOK.md)
    cmds:
      - uv run --project server python -m server.scripts.admin {{.CLI_ARGS}}

  server-load-test:
    desc: EXP-BE-3 - load 1,000 synthetic sessions across 5 organisations into a database on this computer and time every dashboard query (task server-load-test -- --database-url postgresql://...; --cleanup removes them)
    cmds:
      - dotnet build src/ProcSense.Cli -c Release -nologo -v q
      - uv run --project server python -m server.scripts.load_synthetic_sessions --engine '["dotnet", "artifacts/bin/ProcSense.Cli/Release/net9.0/procsense-sim.dll"]' {{.CLI_ARGS}}

  server-db-up:
    desc: Start a throwaway PostgreSQL 17 in Docker for the backend tests and print its address
    cmds:
      - uv run --project tools tools/ci/server_tests.py --db-only

  server-db-down:
    desc: Remove the throwaway PostgreSQL started by server-db-up
    cmds:
      - cmd: docker rm -f procsense-test-pg
        ignore_error: true

  content-extract:
    desc: Parse the walkthrough into content/_extract/walkthrough_extract.json and check the counts (a drafting aid, git-ignored)
    cmds:
      - uv run --project tools tools/content/extract_walkthrough.py

  content-build:
    desc: Build the generated content tables (CSV) and their source-register rows from tools/content/tables, checking every row against the book first
    cmds:
      - uv run --project tools tools/content/build_tables.py

  content-cases:
    desc: Build content/case_files (the 53 playable cases) from tools/content/cases and validate them
    cmds:
      - uv run --project tools tools/content/build_case_files.py
      - uv run --project tools tools/content/build_records.py
      - uv run --project tools tools/content/build_diagnostics.py

  content-refresh:
    desc: Regenerate every generated content file and document in dependency order (tables, case files, imaging library, review packs, equipment sheets, traceability, manifest); run after any content change
    cmds:
      - uv run --project tools tools/content/build_tables.py
      - uv run --project tools tools/content/build_case_files.py
      - uv run --project tools tools/content/build_records.py
      - uv run --project tools tools/content/build_diagnostics.py
      - uv run --project tools tools/content/imaging_library.py
      - uv run --project tools tools/content/image_review_pack.py
      - uv run --project tools tools/data/dataset_cards.py
      - uv run --project tools tools/content/equipment_sheets.py
      - uv run --project tools tools/content/case_gaps.py
      - uv run --project tools tools/content/trace.py
      - uv run --project tools tools/eval/attributions.py
      - uv run --project tools tools/voice/catalogue.py
      - uv run --project tools tools/content/variant_facts.py
      - uv run --project tools tools/content/stacked_partd.py
      - uv run --project tools tools/content/content_manifest.py
      - uv run --project tools tools/content/review_pack.py

  content-trace:
    desc: Regenerate docs/research/traceability.md (walkthrough part -> content files -> register rows)
    cmds:
      - uv run --project tools tools/content/trace.py

  data-fetch:
    desc: Download the open datasets the pictures are built from into tools/data/cache (about 3 GB, git-ignored; only needed to rebuild, see tools/data/README.md)
    cmds:
      - uv run --project tools --extra images tools/data/fetch_all.py

  data-check:
    desc: Verify the downloaded source datasets against tools/data/fetch_manifest.json (no network)
    cmds:
      - uv run --project tools --extra images tools/data/fetch_all.py --check

  data-rebuild:
    desc: Rebuild every generated picture, report, table and register from the fetched datasets (run data-fetch first); the result should match what is committed
    cmds:
      - uv run --project tools --extra images tools/data/ultrasound.py build
      - uv run --project tools --extra images tools/data/ecg_images.py
      - uv run --project tools --extra images tools/data/cxr_images.py build
      - uv run --project tools --extra images tools/data/xsec.py build
      - uv run --project tools tools/content/build_tables.py
      - uv run --project tools tools/content/imaging_library.py
      - uv run --project tools tools/content/image_review_pack.py
      - uv run --project tools tools/data/dataset_cards.py
      - uv run --project tools tools/content/trace.py

  plans-index:
    desc: Rebuild docs/plans/milestones.md from the step files and check step references
    cmds:
      - uv run --project tools tools/plans/milestones.py
      - uv run --project tools tools/plans/pipeline_docs.py

  clean:
    desc: Remove build outputs
    cmds:
      - dotnet clean ProcSense.sln
