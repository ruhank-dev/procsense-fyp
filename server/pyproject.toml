[project]
name = "procsense-server"
version = "0.1.0"
description = "ProcSense hosted backend: FastAPI on PostgreSQL (Supabase)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.28",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]            # speech recognition; not in the hosted image, which has no GPU

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# the application is the package `server` at the repository root, so the root is on the path (this file is in server/)
pythonpath = [".."]
testpaths = ["tests"]
markers = ["db: needs a real PostgreSQL (TEST_DATABASE_URL); set REQUIRE_DB=1 to make a missing one an error instead of a skip"]
