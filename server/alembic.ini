# Alembic settings. Run from the repository root:  uv run --project server alembic -c server/alembic.ini upgrade head
# The database address is never written here: migrations/env.py reads MIGRATION_DATABASE_URL (the session pooler, port 5432).

[alembic]
script_location = %(here)s/migrations
# the repository root, so that `import server` works whatever folder alembic is started from
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
