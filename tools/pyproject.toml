[project]
name = "procsense-tools"
version = "0.1.0"
description = "ProcSense developer tools: content validation, content pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pillow>=10.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# only the picture builders need numpy and pyarrow (parquet); CI and teammates checking content do not
images = ["numpy>=1.26", "pyarrow>=15", "nibabel>=5"]

[tool.uv]
package = false
