# Change-aware testing rules (read by tools/ci/changeaware.py, select_checks.py, run.py). Guide: docs/qa/change_aware_testing.md
#
# A check runs when a changed file matches one of its `inputs`. The same input globs, with the file CONTENTS, form the result-cache key,
# so an unrelated change never invalidates a check, and a change to any input always does.
#
# Glob syntax: `**` crosses folders, `*` stays inside one folder. Patterns match from the repo root. A `.meta` suffix is ignored (a Unity
# .meta file counts as the asset it describes). Over-inclusive inputs are safe (a needless run); missing inputs are not (a stale pass).
version: 1

# A change to any of these runs EVERY check (shared infrastructure: the runner, the task file, CI itself, global tool config).
full_triggers:
  - "tools/ci/**"
  - "Taskfile.yml"
  - ".github/**"
  - ".githooks/**"
  - "global.json"
  - "Directory.Build.props"
  - "tools/pyproject.toml"
  - "tools/uv.lock"
  - "server/pyproject.toml"
  - "server/uv.lock"
  - "unity/ProjectSettings/ProjectVersion.txt"

# Changes that affect no check (generated output, logs, scratch files). Anything NOT matched here and NOT matched by a check's inputs is an
# "unmapped path": the selector then runs everything (the safe default) and says so.
ignore:
  - "artifacts/**"
  - "reports/**"
  - "build/**"
  - "TestResults/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.log"
  - "**/*.trx"
  - "bad.json"
  - "result.json"
  - "bad.session.jsonl"
  - "result.session.jsonl"
  - "unity/Logs/**"
  - "unity/Temp/**"
  - "unity/Library/**"
  - ".vscode/**"
  - ".gitignore"
  - ".gitattributes"

# Shared Unity inputs: anything every Unity check must re-run for.
anchors:
  unity_shared: &unity_shared
    - "unity/ProjectSettings/**"
    - "unity/Packages/manifest.json"
    - "unity/Packages/packages-lock.json"
    - "unity/Assets/**/*.asmdef"
    - "unity/Assets/**/*.asmref"
    - "unity/Assets/Settings/**"
    - "unity/Assets/XR/**"
    - "unity/Assets/Tests/PlayMode/EditorXRTestEnvironment.cs"
    - "unity/Assets/Tests/PlayMode/QuestWalkthrough.cs"
    - "unity/Assets/Tests/PlayMode/TestHostHygiene.cs"      # scene/host reset every room-loading fixture uses (DT-307): a change can reorder-break any PlayMode check
    - "tools/unity/run_unity.py"
  unity_render: &unity_render           # what changes the rendered hospital
    - "unity/Assets/Shaders/**"
    - "unity/Assets/Materials/**"
    - "unity/Assets/Scenes/**"
    - "unity/Assets/Prefabs/**"
    - "unity/Assets/Models/**"
    - "unity/Assets/Textures/**"
    - "unity/Assets/Scripts/Views/**"
    - "unity/Assets/Scripts/Diagnostics/**"
    - "unity/Assets/Resources/**"
    - "unity/Tools/**"

checks:
  # ------------------------------------------------------------------ repository checks (GitHub job: repo_checks)
  docs_check:
    desc: "Project-rule checks no compiler covers (doc links, registers, determinism rules in Core, prompt history) - `task check`"
    job: repo_checks
    cmds: [["uv", "run", "--project", "tools", "tools/ci/repo_checks.py"]]
    tools: [uv, python]
    group: python
    inputs: ["docs/**", "**/*.md", "src/ProcSense.Core/**", "content/**", "tools/ci/tool_mentions_baseline.txt", "INSTRUCTIONS.md"]
  ui_guides_check:
    desc: "Training guide (P3-TRN-01, goal-inactive reasons P3-TRN-02) and voice feedback table (P3-VOX-07): freshness, coverage of every goal, stage, ward item and outcome code, tests"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/content/build_training_guide.py", "--check"]
      - ["uv", "run", "--project", "tools", "tools/content/validate_ui_guides.py"]
      - ["uv", "run", "--project", "tools", "tools/content/test_ui_guides.py"]
    tools: [uv, python]
    group: python
    inputs: ["content/ui/training_guide.json", "content/ui/voice_feedback.json", "content/workflow/workflow.json", "content/flow/flow_maps.json", "content/ward/ward_checklist.json", "tools/content/build_training_guide.py", "tools/content/validate_ui_guides.py", "tools/content/test_ui_guides.py"]
  ui_messages_check:
    desc: "UI message table (P3-API-07): every sign-in, LAN, pairing and compatibility error code the server can give (read from its source) and every client code has a message, tests"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/content/validate_ui_messages.py"]
      - ["uv", "run", "--project", "tools", "tools/content/test_ui_messages.py"]
    tools: [uv, python]
    group: python
    inputs: ["content/ui/ui_messages.json", "server/routers/pairing.py", "server/routers/device_auth.py", "server/auth/dependencies.py", "server/middleware/lan_pairing.py", "server/lan/compat.py", "server/lan/notices.py", "tools/content/validate_ui_messages.py", "tools/content/test_ui_messages.py"]
  demo_laptop_tools_check:
    desc: "Demonstration laptop helpers (P3-NET-04 address QR code, P3-NET-13 model names, P3-VOX-11 degraded check script): unit tests, no server started"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "server", "tools/ci/test_demo_laptop.py"]
      - ["uv", "run", "--project", "server", "tools/ci/test_demo_degraded_check.py"]
    tools: [uv, python]
    group: python
    inputs: ["tools/setup/demo_laptop.py", "tools/setup/qr_text.py", "tools/setup/demo_degraded_check.py", "tools/ci/test_demo_laptop.py", "tools/ci/test_demo_degraded_check.py", "content/ai/model_routes.json"]
  grades_check:
    desc: "Grade table (P3-RES-10, P3-EXM-01): content/scoring/grades.json bands A-D descending within 0-100, pass mark reachable, hint_penalty 0-100, hint_limit 0-10, tests"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/content/validate_grades.py"]
      - ["uv", "run", "--project", "tools", "tools/content/test_grades.py"]
    tools: [uv, python]
    group: python
    inputs: ["content/scoring/grades.json", "tools/content/validate_grades.py", "tools/content/test_grades.py"]
  staff_exam_policy_check:
    desc: "Examination staff-dialogue policy (D3): every staff intent has an examination-safe line, address words, no hinting words or numbers, every replaced practice line reviewed"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/content/validate_staff_exam_policy.py"]
      - ["uv", "run", "--project", "tools", "tools/content/test_staff_exam_policy.py"]
    tools: [uv, python]
    group: python
    inputs: ["content/ai/staff_exam_policy.json", "content/ai/staff_intent_lines.json", "content/ai/intents.json", "tools/content/validate_staff_exam_policy.py", "tools/content/test_staff_exam_policy.py"]
  case_catalogue_check:
    desc: "Scenario catalogue (P3-SCN-02, CI row P3-SCN-11): content/ui/case_catalogue.json is exactly what content/case_files give"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/content/case_catalogue.py", "--check"]
    tools: [uv, python]
    group: python
    inputs: ["content/case_files/**", "content/ui/case_catalogue.json", "tools/content/case_catalogue.py"]
  interactions_check:
    desc: "Interaction catalogue (P3-CTX-01): content/ui/interactions.json is current, every tablet entry belongs to an entity or the wrist menu, spoken entries are allowed ones, tests"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/content/build_interactions.py", "--check"]
      - ["uv", "run", "--project", "tools", "tools/content/test_interactions.py"]
    tools: [uv, python]
    group: python
    inputs: ["content/ui/tablet.json", "content/ui/interactions.json", "content/ai/spoken_actions.json", "tools/content/build_interactions.py", "tools/content/validate_interactions.py", "tools/content/test_interactions.py"]
  interaction_matrix_check:
    desc: "Interaction coverage matrix (P3-INT-01): docs/plans/p3/interaction-matrix.md is what the engine source, the catalogue and the scene emitters give, tests"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/plans/interaction_matrix.py", "--check"]
      - ["uv", "run", "--project", "tools", "tools/ci/test_interaction_matrix.py"]
    tools: [uv, python]
    group: python
    inputs: ["docs/plans/p3/interaction-matrix.md", "content/ui/interactions.json", "src/ProcSense.Core/**/*.cs", "unity/Assets/**/*.unity", "unity/Assets/**/*.prefab", "tools/plans/interaction_matrix.py", "tools/ci/test_interaction_matrix.py"]
  plans_check:
    desc: "Milestones, planning pipeline, P3 plans, planning sync - `task plans-check`"
    job: repo_checks
    cmds:
      - ["uv", "run", "--project", "tools", "tools/plans/milestones.py", "--check"]
      - ["uv", "run", "--project", "tools", "tools/plans/validate_pipeline.py", "--quiet"]
      - ["uv", "run", "--project", "tools", "tools/plans/test_validate_pipeline.py"]
      - ["uv", "run", "--project", "tools", "tools/plans/pipeline_docs.py", "--check"]
      - ["uv", "run", "--project", "tools", "tools/plans/check_planning_sync.py"]
      - ["uv", "run", "--project", "tools", "tools/plans/p3_plans.py", "--check"]
    tools: [uv, python]
    group: python
    inputs: ["docs/plans/**", "docs/context/**", "docs/deferred-tasks.md", "docs/index.md", "docs/previous_prompt.md", "tools/plans/**"]
  python_tests:
    desc: "Content, golden, composer, voice and tool tests plus every generated-file freshness check (task ci -- --quick; no .NET build or tests)"
    job: repo_checks
    cmds: [["uv", "run", "--project", "tools", "tools/ci/run_all.py", "--quick"]]
    tools: [uv, python, dotnet]
    group: python
    inputs: ["tools/**", "content/**", "server/validation/**", "tests/golden/**", "tests/golden_generated/**", "docs/research/**", "docs/context/**", "docs/testing/**", "docs/plans/**", "src/**"]
  quest_config_check:
    desc: "Approved Quest 2 render optimisations still set in the project files (Vulkan, multiview, MSAA 1, HDR/post/shadows off, baked lighting, probes, ASTC, FFR, perf settings, stripping) - source level, no Unity"
    job: repo_checks
    cmds: [["uv", "run", "--project", "tools", "tools/unity/verify_quest_config.py"], ["uv", "run", "--project", "tools", "tools/ci/test_verify_quest_config.py"]]
    tools: [uv, python]
    group: python
    inputs: ["tools/unity/verify_quest_config.py", "tools/ci/test_verify_quest_config.py","unity/ProjectSettings/**", "unity/Assets/Settings/**", "unity/Assets/XR/**", "unity/Assets/UniversalRenderPipelineGlobalSettings.asset", "unity/Assets/Scenes/**", "unity/Assets/Scripts/Views/QuestPerformanceProfile.cs", "unity/Assets/Scripts/Views/QuestRuntimeSettings.cs", "unity/Assets/Scripts/Views/QuestLightingGuard.cs", "unity/Assets/Scripts/XR/QuestRenderTier.cs", "unity/Assets/**/*.png", "unity/Assets/**/*.jpg", "unity/Assets/**/*.tga", "unity/Assets/**/*.exr"]

  # ------------------------------------------------------------------ .NET rules engine (GitHub job: engine)
  rules_engine_tests:
    desc: "Release build with warnings as errors, unit tests, golden runs (determinism)"
    job: engine
    cmds:
      - ["dotnet", "build", "ProcSense.sln", "-c", "Release", "-warnaserror"]
      - ["dotnet", "test", "ProcSense.sln", "--no-build", "-c", "Release"]
      - ["dotnet", "run", "--no-build", "-c", "Release", "--project", "src/ProcSense.Cli", "--", "golden", "--dir", "tests/golden"]
      - ["dotnet", "run", "--no-build", "-c", "Release", "--project", "src/ProcSense.Cli", "--", "golden", "--dir", "tests/golden_generated"]
    tools: [dotnet]
    group: dotnet
    inputs: ["src/**", "tests/**", "ProcSense.sln", ".editorconfig", "content/**"]
  dotnet_format:
    desc: "Code format and style (whitespace and style rules; line endings are the Linux CI's job)"
    job: engine
    cmds:
      - ["dotnet", "format", "whitespace", "ProcSense.sln", "--verify-no-changes"]
      - ["dotnet", "format", "style", "ProcSense.sln", "--no-restore", "--verify-no-changes"]
    tools: [dotnet]
    group: dotnet
    inputs: ["src/**", "tests/**", "ProcSense.sln", ".editorconfig"]
  dependency_audit:
    desc: "No vulnerable NuGet packages (advisories change over time, so a pass is reused for 24 hours at most)"
    job: dependencies
    cmds: [["dotnet", "list", "ProcSense.sln", "package", "--vulnerable", "--include-transitive"]]
    fail_if_output: "has the following vulnerable packages"
    max_age_hours: 24
    tools: [dotnet]
    group: dotnet
    inputs: ["**/*.csproj", "ProcSense.sln", "**/packages.lock.json"]

  # ------------------------------------------------------------------ backend (GitHub job: server)
  backend_tests:
    desc: "FastAPI backend tests against a real PostgreSQL (skipped with a notice when there is no Docker)"
    job: server
    cmds: [["uv", "run", "--project", "tools", "tools/ci/server_tests.py"]]
    tools: [uv, python, dotnet, docker]
    group: backend
    inputs: ["server/**", "src/**", "content/**", "tests/contracts/p3/**", "tools/ci/server_tests.py", "tools/setup/demo_laptop.py", "tools/setup/demo_degraded_check.py"]

  # ------------------------------------------------------------------ Unity (local only: the free GitHub runners have no Unity licence)
  unity_compile:
    desc: "Project compiles (batch launch, no tests)"
    job: unity_compile
    kind: unity
    unity: {mode: compile}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/**/*.cs", "unity/Assets/**/*.shader", "unity/Assets/**/*.hlsl", "unity/Assets/**/*.cginc", *unity_shared]
  unity_editmode:
    desc: "All Unity EditMode tests"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: EditMode}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/**", "unity/Assets/Editor/**", "unity/Assets/Tests/EditMode/**", "tests/contracts/p3/**", "unity/Assets/Scenes/**", "unity/Assets/Prefabs/**", "unity/Assets/Resources/**", "unity/Assets/Shaders/**", *unity_shared]
  unity_playmode_exterior:
    desc: "City visibility, door glass aperture, room culling, fast-path equivalence (ExteriorVisibilityTests, CullingCostTests excluded: benchmark)"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: PlayMode, filter: "ExteriorVisibilityTests"}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/Views/ExteriorVisibility.cs", "unity/Assets/Scripts/Views/RoomVisibility.cs", "unity/Assets/Scripts/Views/QuestExterior.cs", "unity/Assets/Scripts/Views/QuestCullingProfile.cs", "unity/Assets/Scripts/Views/CullCost.cs", "unity/Assets/Scripts/Diagnostics/Perf*.cs", "unity/Assets/Tests/PlayMode/ExteriorVisibilityTests.cs", "unity/Assets/Scenes/**", "unity/Assets/Models/Environment/**", "unity/Assets/Materials/Environment/**", "unity/Assets/Prefabs/Environment/**", *unity_shared]
  unity_playmode_sunshafts:
    desc: "Sun shafts stay drawn with the Android room/exterior culling while the player moves and turns (SunShaftVisibilityTests, DT-311)"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: PlayMode, filter: "SunShaftVisibilityTests"}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Shaders/SunShaft*.shader", "unity/Assets/Textures/Effects/**", "unity/Assets/Scripts/Views/DesktopOnly.cs", "unity/Assets/Scripts/Views/ExteriorVisibility.cs", "unity/Assets/Scripts/Views/RoomVisibility.cs", "unity/Assets/Tests/PlayMode/SunShaftVisibilityTests.cs", "unity/Assets/Scenes/**", "unity/Assets/Materials/Environment/**", *unity_shared]
  unity_playmode_character:
    desc: "Character culler, animation pose, blendshape and wake tests"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: PlayMode, filter: "CharacterPerfTests;CharacterPerfCullTests"}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/Views/CharacterPerf*.cs", "unity/Assets/Scripts/Views/Patient*.cs", "unity/Assets/Scripts/Views/Staff*.cs", "unity/Assets/Scripts/Views/*Animation*.cs", "unity/Assets/Tests/PlayMode/CharacterPerf*.cs", "unity/Assets/Prefabs/Characters/**", "unity/Assets/Models/Characters/**", "unity/Assets/Animations/**", "unity/Assets/Animators/**", *unity_shared]
  unity_playmode_runtime_settings:
    desc: "Quest runtime settings component (refresh-rate read, performance-level hints)"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: PlayMode, filter: "QuestRuntimeSettingsTests"}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/Views/QuestRuntimeSettings.cs", "unity/Assets/Tests/PlayMode/QuestRuntimeSettingsTests.cs", "unity/Assets/XR/**", *unity_shared]
  unity_playmode_flow:
    desc: "Game flow panel: menu flow, examination leak test, duplicate submit, reworded results label (MenuFlowTests, ExamPresentationTests)"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: PlayMode, filter: "MenuFlowTests;ExamPresentationTests"}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/Flow/**", "unity/Assets/Scripts/Sync/DebriefRewriteClient.cs", "unity/Assets/Scripts/Auth/**", "unity/Assets/Tests/PlayMode/MenuFlowTests.cs", "unity/Assets/Tests/PlayMode/ExamPresentationTests.cs", *unity_shared]
  unity_playmode_patient_equipment:
    desc: "Patient equipment through XRI in the shipped menu flow: select, attach to the patient socket, stay on through idle motion, animator culling and LODs, remove, place again, training and examination; unavailable before a session (SensorAttachmentFlowTests, MpfbPatientTests, EquipmentDropTests)"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: PlayMode, filter: "SensorAttachmentFlowTests;MpfbPatientTests;EquipmentDropTests"}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/ActionEmitters/**", "unity/Assets/Scripts/Views/CharacterPerfCuller.cs", "unity/Assets/Scripts/Views/PatientIdleView.cs", "unity/Assets/Scripts/Flow/**", "unity/Assets/Scripts/Boot/BootLoader.cs", "unity/Assets/Scripts/Bridge/SimulationHost.cs", "unity/Assets/Prefabs/Equipment/**", "unity/Assets/Scenes/PatientBay.unity", "unity/Assets/Tests/PlayMode/SensorAttachmentFlowTests.cs", "unity/Assets/Tests/PlayMode/MpfbPatientTests.cs", "unity/Assets/Tests/PlayMode/EquipmentDropTests.cs", *unity_shared]
  unity_playmode_clinical_text:
    desc: "Sharp clinical text on Quest 2 (shared dilated SDF material on the EMR tablet, EMR, monitor and menu panels, reading cone, eye-buffer size report) and the readability floor (ClinicalTextTests, AccessibilityTests)"
    job: unity_tests
    kind: unity
    unity: {mode: tests, platform: PlayMode, filter: "ClinicalTextTests;AccessibilityTests"}
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/UI/Accessibility/**", "unity/Assets/Scripts/Views/UiKit.cs", "unity/Assets/Scripts/Views/QuestPerformanceProfile.cs", "unity/Assets/Scripts/Views/MonitorView.cs", "unity/Assets/Scripts/Views/TabletView.cs", "unity/Assets/Scripts/Views/MainMenuController.cs", "unity/Assets/Scripts/Views/EmrPanelView.cs", "unity/Assets/Scripts/Records/Emr/**", "unity/Assets/Scripts/Flow/**", "unity/Assets/TextMesh Pro/**", "unity/Assets/Tests/PlayMode/ClinicalTextTests.cs", "unity/Assets/Tests/PlayMode/AccessibilityTests.cs", *unity_shared]
  unity_shader_visual:
    desc: "Render the bay with the changed shader/material/lighting setup; frames kept for comparison with the previous render (single-eye 960x540, 40 frames)"
    job: unity_tests
    kind: unity
    unity:
      mode: tests
      platform: PlayMode
      filter: "QuestWalkthrough.Walkthrough"
      env: {BENCH_CONFIGS: "B0", BENCH_FRAMES_MAX: "40", BENCH_SEG: "bay", BENCH_W: "960", BENCH_H: "540", BENCH_JPG: "1"}
      frames_dir: shader_visual
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Shaders/**", "unity/Assets/Materials/**", "unity/Assets/Settings/**", "unity/Assets/Scenes/**", "unity/Assets/Textures/**", "unity/Assets/Tests/PlayMode/QuestWalkthrough.cs", *unity_shared]
  unity_walkthrough_diff:
    desc: "Full path, every frame compared with the unculled render and the original exterior (missing geometry, flicker, pops) - heavy (about 15 min of GPU)"
    job: unity_tests
    kind: unity
    heavy: true
    pwsh: ["tools/unity/final_qa.ps1", "-Stages", "diff", "-Tag", "_ci"]
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/Views/ExteriorVisibility.cs", "unity/Assets/Scripts/Views/RoomVisibility.cs", "unity/Assets/Scripts/Views/QuestExterior.cs", "unity/Assets/Scripts/Views/QuestCullingProfile.cs", "unity/Assets/Scripts/Views/CharacterPerf*.cs", "unity/Assets/Models/Environment/**", "unity/Assets/Materials/Environment/**", "unity/Assets/Scenes/**", "unity/Assets/Shaders/**", "unity/Assets/Tests/PlayMode/QuestWalkthrough.cs", "tools/unity/final_qa.ps1", "tools/unity/walk_qa.py", *unity_shared]
  unity_sweep:
    desc: "4752-pose visibility sweep, doors closed and open - heavy"
    job: unity_tests
    kind: unity
    heavy: true
    pwsh: ["tools/unity/final_qa.ps1", "-Stages", "sweep", "-Tag", "_ci"]
    tools: [unity]
    group: unity
    inputs: ["unity/Assets/Scripts/Views/ExteriorVisibility.cs", "unity/Assets/Scripts/Views/RoomVisibility.cs", "unity/Assets/Scripts/Views/QuestExterior.cs", "unity/Assets/Scripts/Views/QuestCullingProfile.cs", "unity/Assets/Models/Environment/**", "unity/Assets/Materials/Environment/**", "unity/Assets/Scenes/**", "unity/Tools/**", "unity/Assets/Tests/PlayMode/QuestWalkthrough.cs", "tools/unity/final_qa.ps1", *unity_shared]
  benchmark_stereo:
    desc: "Two-eye desktop benchmark (informational, never a gate; results are timings, not a pass/fail) - heavy"
    job: unity_tests
    kind: unity
    heavy: true
    informational: true
    pwsh: ["tools/unity/bench_desktop.ps1", "-Stereo"]
    tools: [unity]
    group: unity
    inputs: *unity_render
  android_build:
    desc: "Quest APK builds (demo variant) - heavy (about 20 min; needs Unity Android support and the Editor closed)"
    job: android_build
    kind: unity
    heavy: true
    cmds: [["uv", "run", "--project", "tools", "tools/unity/run_unity.py", "build", "demo"]]
    tools: [unity, uv]
    group: unity
    inputs: ["unity/Assets/**", "unity/Packages/**", "unity/ProjectSettings/**"]
