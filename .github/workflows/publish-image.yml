name: Publish the service image

# Builds the service image on GitHub (the Linux engine and the content of each version are generated, not stored in git, so the host cannot build it from the repository)
# and pushes it to GitHub's container registry, where the host pulls it (p1-backend-s13). The image holds no secret: the settings are given to the host as environment variables.
#
# Two ways in:
#   - a push to a backend branch builds an image tagged with the commit and the branch name, to try it; it never touches the tag `latest`, which is what the host runs;
#   - the Deploy workflow (deploy.yml) calls this for a commit on main whose CI was green, with latest: true, and then deploys it.

on:
  push:
    branches: ['myt1x54/backend-*']
    paths:
      - 'server/**'
      - 'src/**'
      - 'content/**'
      - 'tools/content/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: 'The commit to build (default: the commit the workflow runs for)'
        type: string
        default: ''
      latest:
        description: 'Also move the tag latest, which is the image the host runs'
        type: boolean
        default: false

concurrency:
  group: publish-image-${{ inputs.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, check and push the image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SHA: ${{ inputs.sha || github.sha }}
      MOVE_LATEST: ${{ inputs.latest && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build the engine for Linux and the content of each version
        run: |
          dotnet publish src/ProcSense.Cli -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o server/engine/bin
          uv run --project tools tools/content/package_versions.py --out server/engine/content

      - name: Name the image and its tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/procsense-server" >> "$GITHUB_ENV"
          branch="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]/' '[:lower:]-' | tr -c 'a-z0-9._\n-' '-')"
          echo "BRANCH_TAG=branch-${branch}" >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          docker build -f server/Dockerfile \
            --build-arg GIT_SHA="${SHA}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${SHA}" \
            -t "${IMAGE}:${SHA}" .

      - name: The image answers /health and its engine verifies a session with its own content
        run: |
          docker run -d --name svc --network host -e PORT=8000 "${IMAGE}:${SHA}"
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 2; done
          curl -fsS http://localhost:8000/health | grep -q "${SHA}"
          VERSION=$(docker exec svc ls /opt/engine/content | grep -- -practice)
          docker cp tests/golden/skeleton1_correct.actions.json svc:/tmp/actions.json
          docker exec svc /opt/engine/bin/procsense-sim run --case VAR-S1-A --seed 42 --actions /tmp/actions.json --out /tmp/run.json --log /tmp/run.session.jsonl --content /opt/engine/content/$VERSION
          docker exec svc /opt/engine/bin/procsense-sim verify --log /tmp/run.session.jsonl --content /opt/engine/content/$VERSION | grep -q '"ok":true'
          # the same again as the service starts the engine: as the app user, under the 64 MiB file-size limit (a first image failed here on the host, signal 25)
          docker exec svc sh -c "ulimit -f 131072; /opt/engine/bin/procsense-sim verify --log /tmp/run.session.jsonl --content /opt/engine/content/$VERSION" | grep -q '"ok":true'
          docker logs svc
          docker rm -f svc

      - name: What the container said (only when the check above failed)
        if: failure()
        run: |
          docker ps -a
          docker logs svc 2>&1 | tail -80 || true
          docker inspect svc --format 'exit code {{.State.ExitCode}}, oom-killed {{.State.OOMKilled}}, error "{{.State.Error}}"' || true
          ls -la server/engine/bin server/engine/content || true

      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the image
        run: |
          docker push "${IMAGE}:${SHA}"
          echo "Pushed ${IMAGE}:${SHA}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${MOVE_LATEST}" = "true" ]; then
            docker tag "${IMAGE}:${SHA}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
            echo "Moved ${IMAGE}:latest to ${SHA}: this is the image the host runs." >> "$GITHUB_STEP_SUMMARY"
          else
            docker tag "${IMAGE}:${SHA}" "${IMAGE}:${BRANCH_TAG}"
            docker push "${IMAGE}:${BRANCH_TAG}"
            echo "Tagged ${IMAGE}:${BRANCH_TAG} (the tag latest was not moved)." >> "$GITHUB_STEP_SUMMARY"
          fi
