name: Main guard

# Alerts for `main`. Teammates push directly to main after running the checks locally (docs/TEAM_GIT_WORKFLOW.md).
# GitHub cannot enforce rules on this private repo on the free plan (docs/CI.md, DT-042), so this workflow only DETECTS:
#   - CI failing on main      -> an issue naming the commit and its author, assigned to the author
#   - a force-push to main    -> an issue (force-pushes are forbidden)
# It cannot undo or prevent a commit that has already reached main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the issue that would be opened (safe way to test this workflow)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

env:
  TEAM: "@ruhank-dev @Sannan47 @Myt1x54"

jobs:
  force-push:
    name: Force-push to main
    if: github.event_name == 'push' && github.event.forced == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          gh issue create --repo "${REPO}" \
            --title "Force-push to main by @${ACTOR} (${SHA:0:7})" \
            --body "${TEAM} - main was force-pushed by @${ACTOR} (now at ${SHA}). Force-pushes are not allowed (docs/TEAM_GIT_WORKFLOW.md). Everyone: stop pushing to main, run 'git fetch origin' and compare before doing anything."

  red-main:
    name: CI failed on main
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue for the failing commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AUTHOR_NAME: ${{ github.event.workflow_run.head_commit.author.name || github.actor }}
          SUBJECT: ${{ github.event.workflow_run.head_commit.message || 'dry-run example commit message' }}
          PUSHER: ${{ github.event.workflow_run.actor.login || github.actor }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          subject=$(printf '%s' "${SUBJECT}" | head -n 1)
          title="CI is red on main (${SHA:0:7})"
          body="${TEAM}
          CI failed on main after a push.
          - Commit: ${SHA} - ${subject}
          - Author: ${AUTHOR_NAME} (pushed by @${PUSHER})
          - Failed run: ${RUN_URL}
          Please pause pushes to main until it is green again, then follow 'What to do when CI fails' in docs/TEAM_GIT_WORKFLOW.md."
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN - would open an issue titled: ${title}"
            echo "${body}"
            exit 0
          fi
          existing=$(gh issue list --repo "${REPO}" --state open --search "${title} in:title" --json number --jq 'length')
          if [ "${existing}" = "0" ]; then
            gh issue create --repo "${REPO}" --title "${title}" --body "${body}" --assignee "${PUSHER}" \
              || gh issue create --repo "${REPO}" --title "${title}" --body "${body}"
          fi
