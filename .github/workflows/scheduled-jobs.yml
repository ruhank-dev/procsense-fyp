name: Scheduled jobs

# Wakes the free service, touches the database so the free project is not left idle, and runs the two jobs the service cannot schedule for itself (p1-backend-s13):
#   every 3 hours  verify the sessions that are still waiting (the service also does this on every upload and when it wakes)
#   once a day     the retention clean-up (p1-backend-s12)
# A call that still fails after its retries fails the run, and GitHub emails that to the repository's people. Needs the repository secrets SERVICE_URL and INTERNAL_KEY; without them it does nothing.

on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    name: Call the service
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVICE_URL: ${{ secrets.SERVICE_URL }}
      INTERNAL_KEY: ${{ secrets.INTERNAL_KEY }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Wake it, touch the database, run the job
        run: |
          if [ -z "$SERVICE_URL" ] || [ -z "$INTERNAL_KEY" ]; then
            echo "SERVICE_URL or INTERNAL_KEY is not set as a repository secret: nothing to do."
            exit 0
          fi
          base="${SERVICE_URL%/}"
          call() { curl --silent --show-error --fail --retry 6 --retry-delay 20 --retry-all-errors --max-time 100 "$@"; }
          echo "waking the service (it can take a minute)"
          call "$base/health" > /dev/null
          call "$base/health/db" > /dev/null && echo "database reachable"
          if [ "$SCHEDULE" != '43 3 * * *' ]; then
            echo "verification sweep:"; call -X POST -H "X-Internal-Key: $INTERNAL_KEY" "$base/internal/verify-pending"; echo
          fi
          if [ "$SCHEDULE" != '17 */3 * * *' ]; then
            echo "retention clean-up:"; call -X POST -H "X-Internal-Key: $INTERNAL_KEY" "$base/internal/retention"; echo
          fi
