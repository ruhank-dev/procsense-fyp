      - name: every generation release cites an evaluation report
        run: uv run --project tools tools/generation/evaluate.py check

      - name: classifier smoke dataset is current and split by speaker
        run: uv run --project tools tools/synth/gen_utterances.py --check

      - name: classifier benchmark scenario cards are current
        run: uv run --project tools tools/bench/dataset.py cards --check

      - name: study analysis (sign-flip test, effect sizes, safety rule, simulated tables refused)
        run: uv run --project tools tools/ci/test_study_analysis.py

      - name: quiz candidates are current
        run: uv run --project tools tools/eval/build_quiz.py --check

      - name: retrieval index and the recorded decision
        run: uv run --project tools tools/ci/test_retrieval.py

      - name: model-call layer against a fake Ollama
        run: uv run --project tools tools/ci/test_llm.py

      - name: session evidence from golden sessions
        run: uv run --project tools tools/ci/test_personalisation_evidence.py

      - name: learner model against simulated learners
        run: uv run --project tools tools/ci/test_personalisation_model.py

      - name: targeting policy, explanations, interpreter and the simulated experiment
        run: uv run --project tools tools/ci/test_personalisation_policy.py

      - name: joint model of laboratory results
        run: uv run --project tools tools/ci/test_generation_joint.py

      - name: synthetic dataset cards are whole
        run: uv run --project tools tools/synth/publish.py --check

      - name: synthetic card tests
        run: uv run --project tools tools/ci/test_synth_cards.py

      - name: AI evaluation report is current
        run: uv run --project tools tools/eval/collect_ai.py --check

      - name: speech recognition vocabulary is current
        run: uv run --project tools tools/content/build_vocab.py --check

      - name: learning analytics (patterns, calibration, reasoning)
        run: uv run --project tools tools/ci/test_analytics.py

      - name: AI feature gate is current and a missing result never passes
        run: uv run --project tools tools/eval/ai_gate.py --check

      - name: AI gate tests
        run: uv run --project tools tools/ci/test_ai_gate.py

      - name: red team of the validator
        run: uv run --project tools tools/ci/test_redteam.py

      - name: synthetic diverse classifier set is current
        run: uv run --project tools tools/bench/synthetic.py check

      - name: recovery handover content is current and sourced
        run: uv run --project tools tools/content/build_recovery_handover.py --check

      - name: intra-operative event content is current and sourced
        run: uv run --project tools tools/content/build_intraop_events.py --check

      - name: labelling toolkit tests
        run: uv run --project tools tools/ci/test_labelling.py

      - name: Content manifest is up to date
        run: uv run --project tools tools/content/content_manifest.py --check

      - name: Medical review pack is up to date
        run: uv run --project tools tools/content/review_pack.py --check

      - name: Plan index is up to date and step references resolve
