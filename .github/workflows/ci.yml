      - name: Treatment library is up to date (17 treatments, checks, doses only with a reviewer)
        run: uv run --project tools tools/content/build_treatments.py --check

      - name: Content packages per mode are what their manifests say (no case below the mode)
        run: |
          uv run --project tools tools/content/package.py --mode dev --check
          uv run --project tools tools/content/package.py --mode practice --check
          uv run --project tools tools/content/package.py --mode assessment --check

      - name: Case file tests
        run: uv run --project tools tools/content/test_case_files.py

      - name: EXP-DATA-2 generated lab values stay in their band (10,000 seeds)
        run: uv run --project tools tools/content/exp_data2.py

      - name: Equipment sheets are up to date (53 items)
        run: uv run --project tools tools/content/equipment_sheets.py --check

      - name: Equipment sheet tests
        run: uv run --project tools tools/content/test_equipment.py

      - name: Imaging library is complete and up to date
        run: uv run --project tools tools/content/imaging_library.py --check

