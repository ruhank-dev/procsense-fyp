name: CI

# What each job guards is listed in docs/CI.md — keep that file and this one in step (INSTRUCTIONS.md section 6b).
on:
  push:
    branches: [main, 'myt1x54/**']   # the owner's branches too, so a change is checked on GitHub before it goes to main
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a newer push to a pull request replaces its older run; every push to main is checked, none is cancelled

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  engine:
    # Build, unit tests and golden runs on both Linux and Windows: identical hashes on both is the determinism proof.
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.319   # pinned: the 9.0.320 download link answers 409 (25 Oct 2026 (UTC)); lift when Microsoft fixes it

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore (retry up to 3 times for network hiccups)
        run: |
          for attempt in 1 2 3; do
            dotnet restore ProcSense.sln && exit 0
            echo "restore failed (attempt $attempt)"; sleep 10
          done
          exit 1

      - name: Build (warnings are errors)
        run: dotnet build ProcSense.sln --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test ProcSense.sln --no-build -c Release --logger "trx;LogFileName=tests-${{ runner.os }}.trx" --results-directory TestResults

      - name: Golden runs through the CLI
        run: dotnet run --no-build -c Release --project src/ProcSense.Cli -- golden --dir tests/golden

      - name: Golden runs of generated cases through the CLI
        run: dotnet run --no-build -c Release --project src/ProcSense.Cli -- golden --dir tests/golden_generated

      - name: Replay a recorded session (determinism round trip)
        run: |
          dotnet run --no-build -c Release --project src/ProcSense.Cli -- run --case VAR-S1-A --seed 42 --actions tests/golden/skeleton1_correct.actions.json --out "$RUNNER_TEMP/run.json"
          dotnet run --no-build -c Release --project src/ProcSense.Cli -- replay --log "$RUNNER_TEMP/run.session.jsonl"

      - name: Verify command accepts the engine's own session (header version 2)
        run: |
          dotnet run --no-build -c Release --project src/ProcSense.Cli -- verify --log "$RUNNER_TEMP/run.session.jsonl" > "$RUNNER_TEMP/verdict.json"
          grep -q '"ok":true' "$RUNNER_TEMP/verdict.json" && grep -q '"header_version":2' "$RUNNER_TEMP/verdict.json"

      - name: Review-status gate refuses an under-approved case
        run: |
          ! dotnet run --no-build -c Release --project src/ProcSense.Cli -- run --case VAR-S1-A --seed 42 --mode assessment --actions tests/golden/skeleton1_correct.actions.json --out "$RUNNER_TEMP/g1.json"

      - uses: astral-sh/setup-uv@v7

      - name: Session report is made from the golden run and valid against its schema
        run: uv run --project tools tools/ci/check_report.py

      - name: Code format (Linux only; Windows checkouts differ in line endings)
        if: runner.os == 'Linux'
        run: dotnet format ProcSense.sln --no-restore --verify-no-changes

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: TestResults
          if-no-files-found: ignore

  server:
    name: Backend (FastAPI on PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/procsense_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.319   # pinned, see ci.yml

      - name: Install the locked dependencies
        run: uv sync --project server --frozen

      - name: Build the engine (the verification tests run it)
        run: dotnet build src/ProcSense.Cli -c Release

      - name: The engine writes a session and the service reads it (the contract between them, header version 2)
        run: |
          dotnet run --no-build -c Release --project src/ProcSense.Cli -- run --case VAR-S1-A --seed 42 --actions tests/golden/skeleton1_correct.actions.json --out "$RUNNER_TEMP/run.json"
          uv run --project server python -m server.scripts.check_session_file "$RUNNER_TEMP/run.session.jsonl"

      - name: Install the browser the web page test drives
        run: uv run --project server playwright install --with-deps chromium

      - name: Backend tests on PostgreSQL 17 (never SQLite), with the real engine and a real browser
        run: |
          export REQUIRE_BROWSER=1
          export ENGINE_CLI="[\"dotnet\", \"$GITHUB_WORKSPACE/artifacts/bin/ProcSense.Cli/Release/net9.0/procsense-sim.dll\"]"
          uv run --project server pytest server/tests -q -rs

      - name: Prepare the engine for Linux and the content of each version for the image
        run: |
          dotnet publish src/ProcSense.Cli -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o server/engine/bin
          uv run --project tools tools/content/package_versions.py --out server/engine/content

      - name: The image builds, answers /health and /health/db, and its engine verifies a session with its content
        run: |
          docker build -f server/Dockerfile -t procsense-server .
          docker run -d --name svc --network host -e PORT=8000 -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/procsense_test procsense-server
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health && break || sleep 2; done
          curl -fsS http://localhost:8000/health/db
          VERSION=$(docker exec svc ls /opt/engine/content | grep -- -practice)
          docker cp tests/golden/skeleton1_correct.actions.json svc:/tmp/actions.json
          docker exec svc /opt/engine/bin/procsense-sim run --case VAR-S1-A --seed 42 --actions /tmp/actions.json --out /tmp/run.json --log /tmp/run.session.jsonl --content /opt/engine/content/$VERSION
          docker exec svc /opt/engine/bin/procsense-sim verify --log /tmp/run.session.jsonl --content /opt/engine/content/$VERSION | grep -q '"ok":true'
          docker logs svc

  repo-checks:
    name: Content, plans and project rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.319   # pinned: the 9.0.320 download link answers 409 (25 Oct 2026 (UTC)); lift when Microsoft fixes it

      - name: Build the engine (the grounding validator tests run it)
        run: dotnet build src/ProcSense.Cli -c Release

      - name: Content is valid and every value has a source
        run: uv run --project tools tools/content/validate.py

      - name: Walkthrough extract has the expected counts
        run: uv run --project tools tools/content/extract_walkthrough.py --check

      - name: Traceability is up to date and every walkthrough part is accounted for
        run: uv run --project tools tools/content/trace.py --check

      - name: Rule evaluator twin tests (same vectors as the C# evaluator)
        run: uv run --project tools tools/content/test_jsonlogic.py

      - name: Content tools tests
        run: uv run --project tools tools/content/test_content_tools.py

      - name: Content tables are verified against the book and up to date
        run: uv run --project tools tools/content/build_tables.py --check

      - name: Content table meaning tests
        run: uv run --project tools tools/content/test_tables.py

      - name: Case content gaps list is up to date
        run: uv run --project tools tools/content/case_gaps.py --check

      - name: Images and reports are valid (ultrasound, ECG, chest X-ray, CT, MRI, MRCP)
        run: uv run --project tools tools/content/validate_images.py

      - name: "Case files are built, valid and up to date (53 cases: 17 P0, 16 P1, 20 P2)"
        run: uv run --project tools tools/content/build_case_files.py --check

      - name: Flow maps are up to date (S1 and S2, 20 stages each)
        run: uv run --project tools tools/content/build_flow_maps.py --check

      - name: Score tables are up to date (AIR, AAS, Alvarado, TG18, ASGE, STOP-Bang, AKI)
        run: uv run --project tools tools/content/build_scores.py --check

      - name: Imaging reports and categories are up to date (51 findings, approved reports, 35 cases)
        run: uv run --project tools tools/content/build_imaging.py --check

      - name: Register ids, blocks and provenance are consistent
        run: uv run --project tools tools/content/register_audit.py --check

      - name: Consent content is up to date (elements, questions, rules)
        run: uv run --project tools tools/content/build_consent.py --check

      - name: Behaviour model is up to date (attributes, transitions, modes, disclosure)
        run: uv run --project tools tools/content/build_behaviour.py --check

      - name: Scoring content is up to date (22 behaviours, rubric, debrief sentences)
        run: uv run --project tools tools/content/build_scoring.py --check

      - name: AI lexicon, intents and shared validator vectors are up to date
        run: |
          uv run --project tools tools/content/build_ai_lexicon.py --check
          uv run --project tools tools/content/build_ai_intents.py --check
          uv run --project tools python server/validation/make_vectors.py --check

      - name: Grounding validator tests (disclosure probes, off-card drugs, false rejects, debrief mutations)
        run: uv run --project tools python server/validation/test_validator.py

      - name: P0 correct-path scripts are what the generator writes (17 cases)
        run: uv run --project tools tools/golden/p0_scripts.py --stale

      - name: Golden suite (17 cases x 4 paths) behaves as each path promises
        run: uv run --project tools tools/golden/paths.py --check

      - name: Attributions are up to date and every register row has what a credit needs
        run: uv run --project tools tools/eval/attributions.py --check

      - name: Voice catalogue is up to date (every line has a source; gaps and drafts listed)
        run: uv run --project tools tools/voice/catalogue.py --check

      - name: Voice catalogue tests (sources, the nurse covers every wristband step, a missing line is reported)
        run: uv run --project tools tools/ci/test_voice_catalogue.py

      - name: Voice renderer tests (respelling, change hash, pitch filter, roles, plan, unique line ids)
        run: uv run --project tools tools/ci/test_voice_render.py

      - name: What-if bindings are up to date (P0 cases, derived from the case content)
        run: uv run --project tools tools/content/build_bindings.py --check

      - name: Stage B validator passes all 53 case files
        run: uv run --project tools tools/composer/stage_b.py --all

      - name: Stage B rejects all 60 mutated cases (12 contradiction types x 5)
        run: uv run --project tools tools/composer/mutate.py --type ALL --n 5

      - name: Composer tests
        run: uv run --project tools python tools/composer/test_composer.py

      - name: Problem discovery rules are up to date (29 rules for the 17 P0 cases)
        run: uv run --project tools tools/content/build_discovery.py --check

      - name: Difficulty settings are up to date (8 dimensions, K 16, 3 sessions)
        run: uv run --project tools tools/content/build_difficulty.py --check

      - name: Events and what-if coverage are up to date (7 events, 47 what-ifs)
        run: uv run --project tools tools/content/build_events.py --check

      - name: Physiology effect plots are up to date (for the review pack)
        run: uv run --project tools tools/physio/plot_effects.py --check

      - name: Behaviour magnitude plots are up to date (for the review pack)
        run: uv run --project tools tools/behaviour/plot.py --check

      - name: Physiology model is up to date (variables, couplings, noise)
        run: uv run --project tools tools/content/build_physio.py --check

      - name: End states are up to date (5 states, delay items, surface-later facts)
        run: uv run --project tools tools/content/build_end_states.py --check

      - name: Safety checklist is up to date (24 items, expected-answer rules)
        run: uv run --project tools tools/content/build_checklist.py --check

      - name: Handover items are up to date (14 items, planned and emergency sets)
        run: uv run --project tools tools/content/build_handover.py --check

      - name: Theatre readiness stations are up to date (12 stations, faults)
        run: uv run --project tools tools/content/build_or.py --check

      - name: Ward checklist is up to date (13 items, verify rules)
        run: uv run --project tools tools/content/build_ward.py --check

      - name: Sample dispatch is up to date (tube station, porter, beginner prompt)
        run: uv run --project tools tools/content/build_diagnostics.py --check

      - name: Patient record is up to date (document types, each case's record, distractor patients)
        run: uv run --project tools tools/content/build_records.py --check

      - name: Deterioration clock and Usman timeline are up to date
        run: uv run --project tools tools/content/build_deterioration.py --check

      - name: Decision outcomes and checks are up to date (5 outcomes, 6 ordered checks, emergency signs)
        run: uv run --project tools tools/content/build_decision.py --check

      - name: Clash table and medicine plans are up to date (18 clashes, factors, plans)
        run: uv run --project tools tools/content/build_clashes.py --check

      - name: Sepsis tiers and timers are up to date (NG253 criteria, timers, infection cases)
        run: uv run --project tools tools/content/build_sepsis.py --check

      - name: Problem types and ladder are up to date (6 types, 7 rungs, P1 to P4)
        run: uv run --project tools tools/content/build_problems.py --check

      - name: Critical result limits are up to date (16 limits, conditions, actions)
        run: uv run --project tools tools/content/build_critical.py --check

      - name: Normal results are up to date (planned patient liver panel from the verified bands)
        run: uv run --project tools tools/content/build_normal_results.py --check

      - name: Investigation indications are up to date (17 tests, planned and emergency)
        run: uv run --project tools tools/content/build_indications.py --check

      - name: NEWS2 chart is up to date (scale 1 and 2, response bands)
        run: uv run --project tools tools/content/build_news2.py --check

      - name: Fasting table is up to date (clear 2 h, milk 6 h, light meal 6 h, heavy meal 8 h)
