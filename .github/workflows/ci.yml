      - name: Deploy checker waits for the new commit, tolerates a sleeping service and fails clearly
        run: uv run --project tools tools/ci/test_wait_for_deploy.py

      - name: Task doctor reads the wanted versions from the repository and reports missing tools
        run: uv run --project tools tools/ci/test_doctor.py

      - name: Repo backup bundles every branch and tag, restores by clone and prunes old copies
        run: uv run --project tools tools/ci/test_repo_backup.py

      - name: Model benchmark harness works against a fake Ollama (contexts never hold unearned facts, scoring, reports)
        run: uv run --project tools tools/ai/test_benchmark.py

      - name: Project rules (determinism rules, hygiene, doc links, registers)
        run: uv run --project tools tools/ci/repo_checks.py

      - name: Pre-push hook behaves (tested in an isolated temporary repository)
        run: uv run --project tools tools/ci/test_pre_push_hook.py

      - name: GitHub workflow and Dependabot files are valid
        run: uvx check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml && uvx check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.319   # pinned: the 9.0.320 download link answers 409 (25 Oct 2026 (UTC)); lift when Microsoft fixes it

      - name: No vulnerable NuGet packages (direct or transitive)
        run: |
          dotnet restore ProcSense.sln
          dotnet list ProcSense.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then echo "vulnerable packages found"; exit 1; fi

      - name: Deprecated NuGet packages (warning only)
        # xunit 2.x is marked Legacy by NuGet; moving to xunit.v3 is tracked as DT-041, so this warns instead of failing.
        run: |
          dotnet list ProcSense.sln package --deprecated 2>&1 | tee deprecated.txt
          if grep -q "has the following deprecated packages" deprecated.txt; then echo "::warning::deprecated NuGet packages found (see this step's log; DT-041)"; fi
