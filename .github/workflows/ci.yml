        run: uv run --project tools tools/content/image_review_pack.py --check

      - name: Dataset register and cards are up to date
        run: uv run --project tools tools/data/dataset_cards.py --check

      - name: Licence register covers every dataset, model and library id, with a decision and a date
        run: uv run --project tools tools/data/licence_register_check.py

      - name: Licence register check tests
        run: uv run --project tools tools/ci/test_licence_register.py

      - name: P1 variant cases hold every fact the book gives them
        run: uv run --project tools tools/content/variant_facts.py --check

      - name: P1 variant check tests
        run: uv run --project tools tools/ci/test_variant_facts.py

      - name: Stacked cases follow Part D (priority ranks, decisions, results)
        run: uv run --project tools tools/content/stacked_partd.py --check

      - name: Stacked-case check tests
        run: uv run --project tools tools/ci/test_stacked_partd.py

      - name: Image and dataset tests
        run: uv run --project tools tools/content/test_images.py

      - name: numeric profiles reproduce the earlier aggregates and cover the lab bands
        run: uv run --project tools tools/data/profile_numeric.py --check

      - name: waveform profile covers every ECG finding of the imaging library
        run: uv run --project tools tools/data/profile_waveforms.py --check

      - name: imaging tags (every picture and finding is tagged and each tag is supported by its wording)
        run: uv run --project tools tools/content/imaging_tags.py --check

      - name: generator packs and evaluation sets current, no raw rows
        run: uv run --project tools tools/generation/build_packs.py --check

      - name: profile and pack tests (statistics, 10,000 draws reproduce the profile, zones, copula)
